spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.chat-id=${TELEGRAM_BOT_CHAT_ID}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.connection-timeout=10000
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.generate_statistics=true