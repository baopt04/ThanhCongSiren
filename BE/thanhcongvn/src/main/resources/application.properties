spring.application.name=thanhcongvn
spring.datasource.url=jdbc:mysql://localhost:3306/thanhcongvn?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HTTP compression for JSON
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

home.featured-categories=coi-hu-bao-dong,tu-dieu-khien,coi-quay-tay,may-thoi-khi-va-dem-hoi-cuu-ho,phu-kien-an-ninh
